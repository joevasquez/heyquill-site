<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <title>Quill</title>
  <!-- The owl, at the one size a tab strip gives you. Palette matches
       assets/quill-owl-sprite.js; hat band is the brand hue (OKLCH 292). -->
  <rect width="16" height="16" rx="3.5" fill="#1a1622"/>
  <g transform="translate(2 2)">
    <!-- hat -->
    <rect x="3" y="0" width="6" height="1" fill="#241d2c"/>
    <rect x="3" y="1" width="1" height="1" fill="#241d2c"/>
    <rect x="4" y="1" width="4" height="1" fill="#544a6e"/>
    <rect x="8" y="1" width="1" height="1" fill="#241d2c"/>
    <rect x="3" y="2" width="1" height="1" fill="#241d2c"/>
    <rect x="4" y="2" width="4" height="1" fill="#a791fa"/>
    <rect x="8" y="2" width="1" height="1" fill="#241d2c"/>
    <rect x="1" y="3" width="10" height="1" fill="#241d2c"/>
    <!-- head -->
    <rect x="2" y="4" width="8" height="1" fill="#c99a63"/>
    <rect x="1" y="5" width="1" height="1" fill="#c99a63"/>
    <rect x="2" y="5" width="2" height="1" fill="#fffaf0"/>
    <rect x="4" y="5" width="4" height="1" fill="#c99a63"/>
    <rect x="8" y="5" width="2" height="1" fill="#fffaf0"/>
    <rect x="10" y="5" width="1" height="1" fill="#c99a63"/>
    <rect x="1" y="6" width="1" height="1" fill="#c99a63"/>
    <rect x="2" y="6" width="1" height="1" fill="#fffaf0"/>
    <rect x="3" y="6" width="1" height="1" fill="#241d2c"/>
    <rect x="4" y="6" width="4" height="1" fill="#c99a63"/>
    <rect x="8" y="6" width="1" height="1" fill="#241d2c"/>
    <rect x="9" y="6" width="1" height="1" fill="#fffaf0"/>
    <rect x="10" y="6" width="1" height="1" fill="#c99a63"/>
    <!-- beak -->
    <rect x="2" y="7" width="3" height="1" fill="#c99a63"/>
    <rect x="5" y="7" width="2" height="1" fill="#f0a83c"/>
    <rect x="7" y="7" width="3" height="1" fill="#c99a63"/>
    <rect x="2" y="8" width="3" height="1" fill="#c99a63"/>
    <rect x="5" y="8" width="2" height="1" fill="#c0741f"/>
    <rect x="7" y="8" width="3" height="1" fill="#c99a63"/>
    <!-- chest -->
    <rect x="2" y="9" width="8" height="1" fill="#c99a63"/>
    <rect x="3" y="10" width="6" height="1" fill="#c99a63"/>
  </g>
</svg>
